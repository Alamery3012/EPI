name: epi_app
description: Offline EPI immunization app for YFCA / MoPHP-EPI (beta).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite_sqlcipher: '>=3.0.0 <4.0.0'
  path: ^1.9.0
  pdf: '>=3.10.0 <4.0.0'
  printing: '>=5.12.0 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
