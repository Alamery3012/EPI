name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Production signing (FRS-SEC-08). Add these repository secrets to sign
      # with YFCA's key; without them the build is signed with a debug key.
      EPI_KEYSTORE_B64: ${{ secrets.EPI_KEYSTORE_B64 }}
      EPI_KEYSTORE_PASSWORD: ${{ secrets.EPI_KEYSTORE_PASSWORD }}
      EPI_KEY_ALIAS: ${{ secrets.EPI_KEY_ALIAS }}
      EPI_KEY_PASSWORD: ${{ secrets.EPI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned for reproducible builds. To move to a newer Flutter, change the
      # version here (or delete the line to use the latest stable).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.0'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create --org org.yfca --project-name epi_app --platforms android .

      - name: Download open-source fonts (interface and A4 card)
        run: bash tool/get_fonts.sh

      - name: Production signing key (only when the secret is set)
        run: |
          if [ -n "$EPI_KEYSTORE_B64" ]; then
            echo "$EPI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/epi-release.jks"
            echo "EPI_KEYSTORE=$RUNNER_TEMP/epi-release.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with the production key."
          else
            echo "::notice::No EPI_KEYSTORE_B64 secret: release APKs are signed with the debug key (test builds only)."
          fi

      - name: Patch Android project (permissions, receivers, minSdk, native code)
        run: bash tool/ci_run.sh patch python3 tool/patch_android.py

      - name: Get packages
        run: bash tool/ci_run.sh pub-get flutter pub get

      - name: Static analysis
        run: bash tool/ci_run.sh analyze flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests (clinical engine, IDs, Excel package)
        run: bash tool/ci_run.sh unit-tests flutter test

      - name: Build release APKs
        run: |
          set -e
          mkdir -p dist
          # Obfuscated release builds (FRS-SEC-08); symbols kept for crash analysis.
          OBF="--obfuscate --split-debug-info=build/symbols"
          bash tool/ci_run.sh build-release flutter build apk --release $OBF
          cp build/app/outputs/flutter-apk/app-release.apk dist/EPI-beta-0.2.0-universal.apk
          bash tool/ci_run.sh build-split flutter build apk --release --split-per-abi $OBF
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/EPI-beta-0.2.0-$abi.apk
          done
          bash tool/ci_run.sh build-debug flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk dist/EPI-beta-0.2.0-debug.apk
          ls -l dist

      - name: APK size check (FRS-NFR-07, under 20 MB per architecture)
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            f=dist/EPI-beta-0.2.0-$abi.apk
            mb=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s $f)/1048576}")
            echo "$abi: $mb MB"
            awk "BEGIN{exit !($mb >= 20)}" && echo "::warning title=APK size::$abi is $mb MB (limit 20 MB)" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EPI-build-logs
          path: ci-logs/

      - uses: actions/upload-artifact@v4
        with:
          name: EPI-beta-0.2.0-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APKs as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="beta-0.2.0-build${{ github.run_number }}"
          gh release create "$tag" dist/*.apk --prerelease --target "${{ github.sha }}" \
            --title "EPI app beta 0.2.0 (build ${{ github.run_number }})" \
            --notes "Automatic build from ${{ github.sha }}. Install EPI-beta-0.2.0-universal.apk on any Android 8+ phone, or the arm64-v8a file on most modern phones."

  # Installs and runs the app on a real Android emulator (API 30, x86_64),
  # walks through the main screens and saves screenshots + logs.
  run-on-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.0'
          cache: true

      - name: Prepare project
        run: |
          flutter create --org org.yfca --project-name epi_app --platforms android .
          bash tool/get_fonts.sh
          python3 tool/patch_android.py
          flutter pub get

      - uses: actions/download-artifact@v4
        with:
          name: EPI-beta-0.2.0-apk
          path: dist

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots logs
            adb logcat -c
            adb install -r dist/EPI-beta-0.2.0-universal.apk
            adb shell monkey -p org.yfca.epi_app -c android.intent.category.LAUNCHER 1
            sleep 15
            (adb shell pidof org.yfca.epi_app && echo "RELEASE APK RUNNING") | tee logs/release_smoke.txt || echo "RELEASE APK NOT RUNNING" | tee logs/release_smoke.txt
            adb logcat -d -b crash > logs/release_crash.txt || true
            adb uninstall org.yfca.epi_app || true
            adb logcat -c
            timeout 1500 flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_flow_test.dart -d emulator-5554 2>&1 | tee logs/flutter_drive.txt || true
            adb logcat -d > logs/logcat.txt || true
            adb logcat -d -b crash > logs/debug_crash.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EPI-emulator-run
          path: |
            screenshots/
            logs/

      - name: Push screenshots and logs to the ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r screenshots logs /tmp/res/ 2>/dev/null || true
          cd /tmp/res
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Emulator run for ${{ github.sha }} (run ${{ github.run_number }})" > README.md
          git add -A && git commit -q -m "Emulator results run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
